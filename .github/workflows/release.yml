name: Build and publish DMG

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify version and build DMG
        shell: bash
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version v$version."
            exit 1
          fi
          zsh ./release.command

      - name: Publish DMG to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          asset="dist/LaunchOS-${tag#v}-arm64.dmg"
          test -f "$asset"
          if assets=$(gh release view "$tag" --json assets --jq '.assets[].name'); then
            if grep -Fxq "${asset##*/}" <<< "$assets"; then
              echo "Release already contains ${asset##*/}."
            else
              gh release upload "$tag" "$asset"
            fi
          else
            gh release create "$tag" "$asset" --verify-tag --title "LaunchOS ${tag#v}" \
              --notes "适用于 Apple 芯片 Mac，要求 macOS 26 或更新版本。打开 DMG，将 LaunchOS.app 拖到「应用程序」。本构建使用临时签名，未进行 Apple 公证。"
          fi
